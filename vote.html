<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>01 — 10</title>
<style>
  :root {
    --bg: #f5f3ef;
    --surface: #ffffff;
    --studio: #eae8e3;
    --ink: #171715;
    --ink-soft: #575650;
    --muted: #93918a;
    --line: rgba(23, 23, 21, 0.09);
    --line-strong: rgba(23, 23, 21, 0.17);
    --gold: #cf9619;
    --gold-soft: #faf3e0;
    --gold-border: #e5cb8b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 110px;
  }

  /* Top Navigation Bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(245, 243, 239, 0.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 12px 24px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mode-tabs {
    display: inline-flex;
    background: rgba(23, 23, 21, 0.05);
    padding: 3px;
    border-radius: 999px;
    gap: 2px;
  }
  .mode-tab {
    height: 28px;
    padding: 0 13px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .mode-tab:hover { color: var(--ink); }
  .mode-tab.active {
    background: var(--ink);
    color: #fff;
  }
  .steps {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(23, 23, 21, 0.04);
    padding: 3px;
    border-radius: 999px;
  }
  .step-pill {
    position: relative;
    height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .step-pill:hover { color: var(--ink); }
  .step-pill.active {
    background: var(--ink);
    color: #fff;
  }
  .step-pill.has-star::after {
    content: "";
    position: absolute;
    top: 3px;
    right: 4px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
  }
  .top-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .ghost-btn {
    height: 30px;
    padding: 0 13px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .ghost-btn:hover {
    background: #fff;
    color: var(--ink);
    border-color: rgba(23, 23, 21, 0.3);
  }
  .ghost-btn.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .star-counter-btn {
    height: 30px;
    padding: 0 11px;
    border-radius: 999px;
    border: 1px solid var(--gold-border);
    background: var(--gold-soft);
    color: #8c6207;
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  /* ===================== VOTE VIEW (Borderless Lookbook) ===================== */
  .stage {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 12px;
  }
  .pair-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card {
    padding: 0 0 50px;
    margin-bottom: 50px;
    border-bottom: 1px solid var(--line);
    animation: cardIn 0.3s ease both;
  }
  .card:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 12px; }
  .card-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .num {
    font-family: "Georgia", "Times New Roman", serif;
    font-size: 56px;
    font-weight: 300;
    line-height: 0.86;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    transition: color 0.2s ease;
  }
  .card.starred .num { color: var(--gold); }
  .card-tools { display: flex; align-items: center; gap: 10px; }
  .remix-btn {
    height: 34px;
    padding: 0 13px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--muted);
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.16s ease;
  }
  .remix-btn:hover { color: var(--ink); border-color: var(--ink); background: #fff; }

  @keyframes starPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  .star-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: transparent;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .star-btn:hover { border-color: rgba(23, 23, 21, 0.36); transform: scale(1.05); }
  .star-btn:active { transform: scale(0.92); }
  .star-btn svg {
    width: 21px; height: 21px;
    stroke: #9c9a92; fill: none; stroke-width: 1.55;
    transition: all 0.2s ease;
  }
  .star-btn.on {
    border-color: var(--gold-border);
    background: var(--gold-soft);
  }
  .star-btn.on svg { stroke: var(--gold); fill: var(--gold); }
  .star-btn.pop svg { animation: starPop 0.3s ease; }

  .tee-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .tee-fig { margin: 0; }
  .tee-box {
    position: relative;
    background: var(--studio);
    border-radius: 3px;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    cursor: zoom-in;
  }
  .tee-box img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .tee-box:hover img { transform: scale(1.024); }
  .zoom-hint {
    position: absolute; bottom: 12px; right: 12px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.82);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
    opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
  }
  .tee-box:hover .zoom-hint { opacity: 1; }
  .tee-fig figcaption {
    margin-top: 10px;
    font-size: 10.5px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pager {
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .nav-btn {
    height: 46px; padding: 0 26px;
    border-radius: 999px; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.18s ease;
  }
  .nav-prev { background: #fff; color: var(--ink); border: 1px solid var(--line-strong); }
  .nav-prev:hover:not(:disabled) { border-color: var(--ink); }
  .nav-prev:disabled { opacity: 0.28; cursor: default; }
  .nav-next { background: var(--ink); color: #fff; border: 1px solid var(--ink); }
  .nav-next:hover { background: #2b2b27; }
  .page-meta {
    font-family: "Georgia", "Times New Roman", serif;
    font-size: 15px; letter-spacing: 0.14em; color: var(--muted);
  }

  .starred-section {
    max-width: 1180px;
    margin: 56px auto 0;
    padding: 32px 24px 0;
    border-top: 1px solid var(--line);
  }
  .starred-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 18px;
  }
  .starred-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 500; letter-spacing: 0.18em; color: var(--ink-soft);
  }
  .starred-title svg { width: 16px; height: 16px; fill: var(--gold); stroke: var(--gold); }
  .starred-actions { display: flex; align-items: center; gap: 8px; }
  .copy-btn {
    height: 34px; padding: 0 16px; border-radius: 999px;
    border: 1px solid var(--ink); background: var(--ink); color: #fff;
    font-size: 12px; font-weight: 500; cursor: pointer;
  }
  .copy-btn:disabled { display: none; }
  .starred-empty { font-size: 12.5px; color: var(--muted); padding: 4px 0 24px; }
  .starred-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    gap: 18px;
  }
  .mini-card { cursor: pointer; transition: transform 0.2s ease; }
  .mini-card:hover { transform: translateY(-2px); }
  .mini-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .mini-num { font-family: "Georgia", "Times New Roman", serif; font-size: 24px; font-weight: 300; }
  .mini-rm { background: none; border: none; color: var(--gold); font-size: 17px; cursor: pointer; padding: 2px 6px; }
  .mini-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .mini-imgs img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; border-radius: 3px; background: var(--studio); }

  .dock {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60;
    background: rgba(23, 23, 21, 0.90); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    color: #fff; padding: 8px 10px 8px 16px; border-radius: 999px;
    display: flex; align-items: center; gap: 9px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22); font-size: 13px; max-width: 92vw;
  }
  .dock-star { color: #f0bc3a; }
  .dock-nums { display: flex; gap: 5px; overflow-x: auto; }
  .dock-pill {
    background: rgba(255, 255, 255, 0.14); padding: 3px 9px; border-radius: 999px;
    font-size: 12px; cursor: pointer;
  }
  .dock-copy {
    background: #fff; color: var(--ink); border: none; border-radius: 999px;
    padding: 5px 13px; font-size: 12px; font-weight: 600; cursor: pointer;
  }

  /* ===================== DIY CUSTOM TEE STUDIO ===================== */
  .diy-wrap {
    display: none;
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 40px;
  }
  .diy-wrap.active { display: block; }

  .diy-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .diy-side-seg {
    display: inline-flex;
    background: rgba(23, 23, 21, 0.06);
    padding: 3px;
    border-radius: 999px;
  }
  .diy-side-seg button {
    height: 30px; padding: 0 16px; border: none; border-radius: 999px;
    background: transparent; color: var(--muted); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.16s ease;
  }
  .diy-side-seg button.active {
    background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .diy-top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .diy-primary-btn {
    height: 34px; padding: 0 18px; border-radius: 999px;
    border: none; background: var(--ink); color: #fff;
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: opacity 0.16s ease;
  }
  .diy-primary-btn:hover { opacity: 0.86; }

  .diy-boards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  .diy-board-col { display: flex; flex-direction: column; }
  .diy-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--studio);
    border-radius: 4px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    border: 2px solid transparent;
    transition: border-color 0.2s ease;
  }
  .diy-stage.active-side { border-color: rgba(23, 23, 21, 0.28); }
  .diy-base {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover; pointer-events: none;
  }
  .diy-mask-layer {
    position: absolute; inset: 0;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    pointer-events: none;
  }
  .diy-mask-layer.multiply { mix-blend-mode: multiply; }
  .diy-print-img {
    position: absolute;
    transform-origin: center center;
    pointer-events: none;
    display: block;
  }
  .diy-hit-layer {
    position: absolute; inset: 0;
  }
  .diy-hit-box {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: grab;
    border: 1.5px dashed transparent;
    border-radius: 4px;
    transition: border-color 0.15s ease;
  }
  .diy-hit-box:hover { border-color: rgba(23, 23, 21, 0.28); }
  .diy-hit-box.selected { border-color: rgba(207, 150, 25, 0.85); }
  .diy-hit-box:active { cursor: grabbing; }
  .diy-board-cap {
    margin-top: 9px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
  }
  .diy-board-cap .active-dot {
    color: var(--ink); font-weight: 600; letter-spacing: 0.08em;
  }

  /* Selected Layer Control Strip */
  .diy-ctrl {
    margin-top: 20px;
    padding: 14px 18px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px 18px;
  }
  .diy-slider-group {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--ink-soft);
  }
  .diy-slider-group input[type=range] {
    width: 140px; accent-color: var(--ink); cursor: pointer;
  }
  .diy-presets {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .diy-chip {
    height: 28px; padding: 0 11px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: #fff;
    color: var(--ink-soft); font-size: 11.5px; cursor: pointer;
    transition: all 0.14s ease;
  }
  .diy-chip:hover { border-color: var(--ink); color: var(--ink); }
  .diy-chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .diy-chip.danger { color: #a63228; border-color: rgba(166, 50, 40, 0.28); }
  .diy-chip.danger:hover { background: #fdf2f1; border-color: #a63228; }

  /* Layer pills strip */
  .diy-layers-bar {
    margin-top: 12px;
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  }
  .layer-pill {
    height: 28px; padding: 0 11px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: transparent;
    color: var(--ink-soft); font-size: 11.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .layer-pill.active {
    background: var(--gold-soft); border-color: var(--gold-border); color: #8c6207; font-weight: 600;
  }

  /* Print Asset Shelf */
  .diy-shelf-head {
    margin-top: 22px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .diy-cats { display: flex; gap: 6px; flex-wrap: wrap; }
  .diy-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    gap: 10px;
  }
  .diy-asset {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 6px 7px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer;
    transition: all 0.16s ease;
  }
  .diy-asset:hover { border-color: var(--ink); transform: translateY(-2px); }
  .diy-asset img {
    width: 100%; height: 78px; object-fit: contain; display: block;
  }
  .diy-asset span {
    font-size: 11px; color: var(--ink-soft); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .diy-upload-card {
    background: transparent;
    border: 1.5px dashed var(--line-strong);
    justify-content: center;
    min-height: 112px;
    color: var(--ink-soft);
    font-size: 12px;
  }
  .diy-upload-card:hover { background: #fff; border-color: var(--ink); color: var(--ink); }

  /* ===================== DEEP ZOOM LIGHTBOX ===================== */
  .lb {
    position: fixed; inset: 0; z-index: 100;
    background: var(--studio);
    display: none; flex-direction: column;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .lb.open { display: flex; }
  .lb.detail-mode { background: #ffffff; }

  .lb-top {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    background: rgba(234, 232, 227, 0.88);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .lb.detail-mode .lb-top { background: rgba(255, 255, 255, 0.90); }
  .lb-left { display: flex; align-items: center; gap: 12px; }
  .lb-id { font-family: "Georgia", "Times New Roman", serif; font-size: 22px; }
  .lb-seg {
    display: inline-flex; background: rgba(23, 23, 21, 0.06);
    padding: 3px; border-radius: 999px; gap: 2px;
  }
  .lb-seg button {
    border: none; background: transparent; color: var(--muted);
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
  }
  .lb-seg button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .lb-right { display: flex; align-items: center; gap: 8px; }
  .lb-icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line-strong); background: #fff; color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px;
  }
  .lb-icon-btn.star-on { border-color: var(--gold-border); background: var(--gold-soft); color: var(--gold); }
  .lb-icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .lb-icon-btn.star-on svg { fill: var(--gold); stroke: var(--gold); }

  .lb-viewport {
    position: relative; flex: 1; overflow: hidden;
    display: flex; align-items: center; justify-content: center; cursor: zoom-in;
  }
  .lb-viewport.zoomed { cursor: grab; }
  .lb-viewport.dragging { cursor: grabbing; }
  .lb-canvas {
    transform-origin: center center; will-change: transform;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-canvas.smooth { transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1); }
  .lb-canvas img {
    max-width: 94vw; max-height: calc(100vh - 146px);
    width: auto; height: auto; display: block; pointer-events: none;
    transition: opacity 0.18s ease;
  }
  .lb-canvas img.loading { opacity: 0.12; }
  .lb-spinner {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 8px 16px; border-radius: 999px;
    background: rgba(23, 23, 21, 0.78); color: #fff;
    font-size: 12px; letter-spacing: 0.06em; pointer-events: none;
    opacity: 0; transition: opacity 0.15s ease;
  }
  .lb-spinner.show { opacity: 1; }

  .lb-bar {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; border-radius: 999px;
    background: rgba(23, 23, 21, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    color: #fff; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22); max-width: 94vw;
  }
  .z-group { display: flex; align-items: center; gap: 2px; }
  .z-btn {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: transparent; color: #fff; font-size: 18px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .z-btn:hover { background: rgba(255, 255, 255, 0.16); }
  .z-readout {
    min-width: 54px; height: 30px; padding: 0 8px; border-radius: 999px; border: none;
    background: rgba(255, 255, 255, 0.12); color: #fff; font-size: 12px;
    font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .lb-div { width: 1px; height: 18px; background: rgba(255, 255, 255, 0.18); }
  .view-pill {
    display: inline-flex; background: rgba(255, 255, 255, 0.12);
    border-radius: 999px; padding: 2px; gap: 2px;
  }
  .view-pill button {
    height: 30px; padding: 0 13px; border-radius: 999px; border: none;
    background: transparent; color: rgba(255, 255, 255, 0.72);
    font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .view-pill button.active { background: #fff; color: var(--ink); }

  @media (max-width: 760px) {
    .topbar-inner { padding: 10px 14px; grid-template-columns: auto 1fr auto; gap: 6px; }
    .mode-tab { height: 26px; padding: 0 9px; font-size: 11px; }
    .step-pill { height: 26px; padding: 0 7px; font-size: 11px; }
    .ghost-btn { height: 26px; padding: 0 9px; font-size: 11px; }
    .star-counter-btn { height: 26px; padding: 0 8px; font-size: 11px; }
    .stage { padding: 22px 14px 8px; }
    .card { padding-bottom: 28px; margin-bottom: 28px; }
    .num { font-size: 40px; }
    .card-head { margin-bottom: 13px; }
    .star-btn { width: 40px; height: 40px; }
    .remix-btn { height: 30px; padding: 0 10px; font-size: 11px; }
    .tee-pair { gap: 8px; }
    .tee-fig figcaption { margin-top: 6px; font-size: 9px; }
    .zoom-hint { display: none; }
    .nav-btn { height: 42px; padding: 0 18px; font-size: 13px; }
    .starred-section { padding: 24px 14px 0; margin-top: 34px; }
    .diy-wrap { padding: 16px 14px 36px; }
    .diy-boards { grid-template-columns: 1fr; gap: 14px; }
    .diy-board-col.mob-hidden { display: none; }
    .diy-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .diy-asset img { height: 64px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-row">
      <div class="mode-tabs">
        <button class="mode-tab active" id="tabVote" onclick="switchApp('vote')">01—10</button>
        <button class="mode-tab" id="tabDiy" onclick="switchApp('diy')">DIY 拼装</button>
      </div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="top-actions" id="voteTopActions">
      <button class="star-counter-btn" id="starJumpBtn" onclick="scrollToStarred()" style="display:none;">★ <span id="topStarNum">0</span></button>
      <button class="ghost-btn" id="modeBtn" onclick="toggleMode()">全部</button>
    </div>
  </div>
</header>

<!-- ==================== VOTE APP ==================== -->
<div id="voteApp">
  <main class="stage">
    <div class="pair-grid" id="stageGrid"></div>

    <div class="pager" id="pager">
      <button class="nav-btn nav-prev" id="prevBtn" onclick="go(-1)">← 上一组</button>
      <div class="page-meta" id="pageMeta">1 / 5</div>
      <button class="nav-btn nav-next" id="nextBtn" onclick="go(1)">下一组 →</button>
    </div>
  </main>

  <section class="starred-section" id="starredSection">
    <div class="starred-head">
      <div class="starred-title">
        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span id="starredCount">已收藏 0 款</span>
      </div>
      <div class="starred-actions">
        <button class="ghost-btn" id="onlyStarBtn" onclick="toggleOnlyStarred()" style="display:none;">仅看已收藏</button>
        <button class="copy-btn" id="copyBtn" onclick="copyStarred()" disabled>复制编号</button>
      </div>
    </div>
    <div id="starredBody"></div>
  </section>

  <div class="dock" id="dock" style="display:none;">
    <span class="dock-star">★</span>
    <div class="dock-nums" id="dockNums"></div>
    <button class="dock-copy" onclick="copyStarred()" id="dockCopyBtn">复制</button>
  </div>
</div>

<!-- ==================== DIY STUDIO APP ==================== -->

let appMode = 'vote'; // 'vote' | 'diy'
let page = 0;
let viewMode = 'pair'; // 'pair' | 'all' | 'starred'
let starred = new Set(JSON.parse(localStorage.getItem('lily_tee_stars') || '[]'));

function switchApp(m) {
  appMode = m;
  document.getElementById('tabVote').classList.toggle('active', m === 'vote');
  document.getElementById('tabDiy').classList.toggle('active', m === 'diy');
  document.getElementById('voteApp').style.display = (m === 'vote') ? 'block' : 'none';
  document.getElementById('diyApp').classList.toggle('active', m === 'diy');
  document.getElementById('steps').style.display = (m === 'vote') ? 'flex' : 'none';
  document.getElementById('voteTopActions').style.visibility = (m === 'vote') ? 'visible' : 'hidden';
  if (m === 'diy') renderDiyAll();
  window.scrollTo({ top: 0 });
}

function saveStars() {
  localStorage.setItem('lily_tee_stars', JSON.stringify([...starred]));
}

function renderSteps() {
  const el = document.getElementById('steps');
  if (viewMode !== 'pair' || appMode !== 'vote') {
    el.style.visibility = 'hidden';
    return;
  }
  el.style.visibility = 'visible';
  const labels = ['01–02', '03–04', '05–06', '07–08', '09–10'];
  const shortLabels = ['1', '2', '3', '4', '5'];
  const mobile = window.innerWidth <= 760;
  el.innerHTML = [0,1,2,3,4].map(i => {
    const pairIds = [ITEMS[i*2].id, ITEMS[i*2+1].id];
    const hasStar = pairIds.some(id => starred.has(id));
    return `<button class="step-pill ${i === page ? 'active' : ''} ${hasStar ? 'has-star' : ''}" onclick="jump(${i})">${mobile ? shortLabels[i] : labels[i]}</button>`;
  }).join('');
}

function cardHTML(item, popId) {
  const isStar = starred.has(item.id);
  return `
    <article class="card ${isStar ? 'starred' : ''}" id="card-${item.id}">
      <div class="card-head">
        <div class="num">${item.id}</div>
        <div class="card-tools">
          <button class="remix-btn" onclick="remixToDiy('${item.id}')">拿去 DIY</button>
          <button class="star-btn ${isStar ? 'on' : ''} ${popId === item.id ? 'pop' : ''}" aria-label="Star ${item.id}" onclick="toggleStar('${item.id}')">
            ${STAR_SVG}
          </button>
        </div>
      </div>
      <div class="tee-pair">
        <figure class="tee-fig">
          <div class="tee-box" onclick="openLb('${item.id}', 'front')">
            <img src="${item.front}" alt="${item.id} front" loading="eager" />
            <span class="zoom-hint">${ZOOM_SVG}</span>
          </div>
          <figcaption>Front</figcaption>
        </figure>
        <figure class="tee-fig">
          <div class="tee-box" onclick="openLb('${item.id}', 'back')">
            <img src="${item.back}" alt="${item.id} back" loading="eager" />
            <span class="zoom-hint">${ZOOM_SVG}</span>
          </div>
          <figcaption>Back</figcaption>
        </figure>
      </div>
    </article>
  `;
}

function renderStage(popId = null) {
  const grid = document.getElementById('stageGrid');
  const pager = document.getElementById('pager');
  let slice;
  if (viewMode === 'all') slice = ITEMS;
  else if (viewMode === 'starred') {
    slice = ITEMS.filter(x => starred.has(x.id));
    if (!slice.length) { viewMode = 'pair'; slice = ITEMS.slice(page * 2, page * 2 + 2); }
  } else {
    slice = ITEMS.slice(page * 2, page * 2 + 2);
  }
  grid.innerHTML = slice.map(item => cardHTML(item, popId)).join('');
  pager.style.display = (viewMode === 'pair') ? 'flex' : 'none';
  document.getElementById('prevBtn').disabled = (page === 0);
  document.getElementById('nextBtn').textContent = (page === 4) ? '查看已收藏 ↓' : '下一组 →';
  document.getElementById('pageMeta').textContent = `${page + 1} / 5`;

  const modeBtn = document.getElementById('modeBtn');
  modeBtn.textContent = (viewMode === 'all') ? '两组' : '全部';
  modeBtn.classList.toggle('active', viewMode === 'all');

  const onlyBtn = document.getElementById('onlyStarBtn');
  onlyBtn.classList.toggle('active', viewMode === 'starred');
  onlyBtn.textContent = (viewMode === 'starred') ? '返回两组' : '仅看已收藏';
  renderSteps();
}

function renderStarred() {
  const list = ITEMS.filter(x => starred.has(x.id));
  document.getElementById('starredCount').textContent = `已收藏 ${list.length} 款`;
  document.getElementById('copyBtn').disabled = (list.length === 0);

// =========================================================================
// Deep Multi-Level Zoom Lightbox (with Instant Preload + Clear Loading State)
// =========================================================================
const lb = document.getElementById('lb');
const lbViewport = document.getElementById('lbViewport');
const lbCanvas = document.getElementById('lbCanvas');
const lbImg = document.getElementById('lbImg');
const lbSpinner = document.getElementById('lbSpinner');
const zReadout = document.getElementById('zReadout');

const ZOOM_STEPS = [1, 2.2, 4, 6];
let lbItemId = '01';
let lbSide = 'back';
let lbDetail = false;
let lbLoadToken = 0;
let scale = 1, tx = 0, ty = 0;

function clampPan() {
  if (scale <= 1.01) { tx = 0; ty = 0; return; }
  const baseW = lbImg.offsetWidth || lbViewport.clientWidth;
  const baseH = lbImg.offsetHeight || lbViewport.clientHeight;
  const vw = lbViewport.clientWidth;
  const vh = lbViewport.clientHeight;
  const maxX = Math.max(0, (baseW * scale - vw) / 2 + 48);
  const maxY = Math.max(0, (baseH * scale - vh) / 2 + 48);
  tx = Math.max(-maxX, Math.min(maxX, tx));
  ty = Math.max(-maxY, Math.min(maxY, ty));
}

function applyTransform(smooth = false) {
  clampPan();
  lbCanvas.classList.toggle('smooth', smooth);
  lbCanvas.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
  zReadout.textContent = Math.round(scale * 100) + '%';
  lbViewport.classList.toggle('zoomed', scale > 1.02);
}

function zoomTo(targetScale, clientX = null, clientY = null, smooth = true) {
  const next = Math.max(1, Math.min(6, targetScale));
  if (next <= 1.01) { scale = 1; tx = 0; ty = 0; applyTransform(smooth); return; }
  if (clientX !== null && clientY !== null) {
    const vr = lbViewport.getBoundingClientRect();
    const ox = clientX - (vr.left + vr.width / 2);
    const oy = clientY - (vr.top + vr.height / 2);
    const ratio = next / scale;
    tx = ox - (ox - tx) * ratio;
    ty = oy - (oy - ty) * ratio;
  }
  scale = next;
  applyTransform(smooth);
}

function resetZoom(smooth = true) { zoomTo(1, null, null, smooth); }

function stepZoom(dir, clientX = null, clientY = null) {
  if (dir > 0) {
    const next = ZOOM_STEPS.find(s => s > scale + 0.15);
    zoomTo(next || 6, clientX, clientY, true);
  } else {
    const prev = [...ZOOM_STEPS].reverse().find(s => s < scale - 0.15);
    zoomTo(prev || 1, clientX, clientY, true);
  }
}

function cycleTapZoom(clientX, clientY) {
  if (scale < 1.8) zoomTo(2.2, clientX, clientY, true);
  else if (scale < 3.4) zoomTo(4, clientX, clientY, true);
  else if (scale < 5.2) zoomTo(6, clientX, clientY, true);
  else resetZoom(true);
}

function preloadUrl(u) {
  const i = new Image();
  i.src = u;
}

function syncLbUI() {
  const item = ITEMS.find(x => x.id === lbItemId);
  if (!item) return;
  document.getElementById('lbId').textContent = item.id;
  document.getElementById('lbFrontBtn').classList.toggle('active', lbSide === 'front');
  document.getElementById('lbBackBtn').classList.toggle('active', lbSide === 'back');
  document.getElementById('viewTeeBtn').classList.toggle('active', !lbDetail);
  document.getElementById('viewDetBtn').classList.toggle('active', lbDetail);
  lb.classList.toggle('detail-mode', lbDetail);

  // Immediately preload sibling detail & other side so switches feel instantaneous
  preloadUrl(lbSide === 'front' ? item.frontDetail : item.backDetail);
  preloadUrl(lbSide === 'front' ? item.back : item.front);

  const src = lbDetail
    ? (lbSide === 'front' ? item.frontDetail : item.backDetail)
    : (lbSide === 'front' ? item.front : item.back);

  if (lbImg.getAttribute('src') !== src) {
    const tok = ++lbLoadToken;
    lbImg.classList.add('loading');
    lbSpinner.classList.add('show');
    const loader = new Image();
    loader.onload = () => {
      if (tok !== lbLoadToken) return;
      lbImg.src = src;
      lbImg.classList.remove('loading');
      lbSpinner.classList.remove('show');
      applyTransform(false);
    };
    loader.onerror = () => {
      if (tok !== lbLoadToken) return;
      lbImg.classList.remove('loading');
      lbSpinner.textContent = '加载超时，请重试';
      setTimeout(() => { lbSpinner.classList.remove('show'); lbSpinner.textContent = '加载高清原图…'; }, 1800);
    };
    loader.src = src;
  }
  syncLbStar();
}

function syncLbStar() {
  document.getElementById('lbStarBtn').classList.toggle('star-on', starred.has(lbItemId));
}

function openLb(id, side) {
  lbItemId = id;
  lbSide = side;
  lbDetail = false;
  resetZoom(false);
  syncLbUI();
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLb() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
  resetZoom(false);
}

function setLbSide(side) {
  if (lbSide === side) return;
  lbSide = side;
  resetZoom(false);
  syncLbUI();
}

function setLbDetail(isDet) {
  if (lbDetail === isDet) return;
  lbDetail = isDet;
  resetZoom(false);
  syncLbUI();
}

function toggleLbStar() { toggleStar(lbItemId); }

lbViewport.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.24 : 1 / 1.24;
  zoomTo(scale * factor, e.clientX, e.clientY, false);
}, { passive: false });

const pointers = new Map();
let dragStart = null, movedDist = 0, pinchStartDist = 0, pinchStartScale = 1;

lbViewport.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  lbViewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    dragStart = { x: e.clientX, y: e.clientY, tx, ty };
    movedDist = 0;
    if (scale > 1.02) lbViewport.classList.add('dragging');
  } else if (pointers.size === 2) {
    const pts = [...pointers.values()];
    pinchStartDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
    pinchStartScale = scale;
    dragStart = null;
  }
});

lbViewport.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinchStartDist > 0) {
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
    zoomTo(pinchStartScale * (dist / pinchStartDist), (pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2, false);
    return;
  }
  if (pointers.size === 1 && dragStart) {
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    movedDist = Math.max(movedDist, Math.hypot(dx, dy));
    if (scale > 1.02) {
      tx = dragStart.tx + dx;
      ty = dragStart.ty + dy;
      applyTransform(false);
    }
  }
});

function endPointer(e) {
  const wasSingle = (pointers.size === 1 && dragStart);
  pointers.delete(e.pointerId);
  lbViewport.classList.remove('dragging');
  if (pointers.size < 2) pinchStartDist = 0;
  if (wasSingle && movedDist < 7) cycleTapZoom(e.clientX, e.clientY);
  if (pointers.size === 0) dragStart = null;
}
lbViewport.addEventListener('pointerup', endPointer);
lbViewport.addEventListener('pointercancel', endPointer);

// =========================================================================
// DIY CUSTOM TEE STUDIO (Multi-Layer Drag, Resize, Multiply Blend, Export)
// =========================================================================
let diySide = 'front';
let diyCat = '全部';
let diyAddLayerMode = false; // false = replace active layer, true = add extra layer
let diyLayerUid = 1;
const diyState = {
  front: [],
  back: []
};
const diySel = { front: null, back: null };
const aspectCache = new Map(); // src -> h/w ratio

function createLayerFromAsset(asset) {
  return {
    uid: diyLayerUid++,
    label: asset.label,
    src: asset.src,
    x: 50,
    y: asset.dy,
    w: asset.dw,
    flipX: false,
    blend: 'multiply',
    custom: false
  };
}

function initDiyDefault() {
  const aF = DIY_ASSETS.find(a => a.id === 'boy_classic');
  const aB = DIY_ASSETS.find(a => a.id === 'grass_real');
  const lF = createLayerFromAsset(aF);
  const lB = createLayerFromAsset(aB);
  diyState.front = [lF];
  diyState.back = [lB];
  diySel.front = lF.uid;
  diySel.back = lB.uid;
}

function remixToDiy(itemId) {
  const pair = ITEM_TO_DIY[itemId] || ['boy_classic', 'grass_real'];
  const aF = DIY_ASSETS.find(a => a.id === pair[0]);
  const aB = DIY_ASSETS.find(a => a.id === pair[1]);
  const lF = createLayerFromAsset(aF);
  const lB = createLayerFromAsset(aB);
  diyState.front = [lF];
  diyState.back = [lB];
  diySel.front = lF.uid;
  diySel.back = lB.uid;
  switchApp('diy');
}

function setDiySide(side) {
  diySide = side;
  document.getElementById('diySideF').classList.toggle('active', side === 'front');
  document.getElementById('diySideB').classList.toggle('active', side === 'back');
  document.getElementById('diyStageFront').classList.toggle('active-side', side === 'front');
  document.getElementById('diyStageBack').classList.toggle('active-side', side === 'back');
  document.getElementById('diyColFront').classList.toggle('mob-hidden', side !== 'front');
  document.getElementById('diyColBack').classList.toggle('mob-hidden', side !== 'back');
  document.getElementById('diyCapF').textContent = side === 'front' ? '● 编辑中（可拖动印花）' : '';
  document.getElementById('diyCapB').textContent = side === 'back' ? '● 编辑中（可拖动印花）' : '';
  renderDiyControls();
}

function getActiveLayer() {
  const list = diyState[diySide];
  if (!list.length) return null;
  let found = list.find(l => l.uid === diySel[diySide]);
  if (!found) { found = list[list.length - 1]; diySel[diySide] = found.uid; }
  return found;
}

function ensureAspect(src, cb) {
  if (aspectCache.has(src)) { cb(aspectCache.get(src)); return; }
  const i = new Image();
  i.onload = () => {
    const r = i.naturalHeight / Math.max(1, i.naturalWidth);
    aspectCache.set(src, r);
    cb(r);
  };
  i.src = src;
}

function renderDiyBoard(side) {
  const mulEl = document.getElementById(side === 'front' ? 'diyMulFront' : 'diyMulBack');
  const normEl = document.getElementById(side === 'front' ? 'diyNormFront' : 'diyNormBack');
  const hitEl = document.getElementById(side === 'front' ? 'diyHitFront' : 'diyHitBack');
  mulEl.innerHTML = '';
  normEl.innerHTML = '';
  hitEl.innerHTML = '';

  const list = diyState[side];
  list.forEach(layer => {
    const ratio = aspectCache.get(layer.src);
    if (!ratio) { ensureAspect(layer.src, () => renderDiyBoard(side)); }
    const hPct = layer.w * (ratio || 1);

    const img = document.createElement('img');
    img.className = 'diy-print-img';
    img.src = layer.src;
    img.style.left = layer.x + '%';
    img.style.top = layer.y + '%';
    img.style.width = layer.w + '%';
    img.style.transform = `translate(-50%, -50%) scaleX(${layer.flipX ? -1 : 1})`;
    (layer.blend === 'multiply' ? mulEl : normEl).appendChild(img);

    const hit = document.createElement('div');
    hit.className = 'diy-hit-box' + (side === diySide && diySel[side] === layer.uid ? ' selected' : '');
    hit.style.left = layer.x + '%';
    hit.style.top = layer.y + '%';
    hit.style.width = Math.max(10, layer.w) + '%';
    hit.style.height = Math.max(10, hPct) + '%';

    hit.addEventListener('pointerdown', e => {
      e.stopPropagation();
      if (diySide !== side) setDiySide(side);
      diySel[side] = layer.uid;
      renderDiyBoard('front');
      renderDiyBoard('back');
      renderDiyControls();

      const stageRect = hitEl.getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY;
      const lx0 = layer.x, ly0 = layer.y;
      hit.setPointerCapture(e.pointerId);

      const onMove = ev => {
        const dxPct = (ev.clientX - sx) / stageRect.width * 100;
        const dyPct = (ev.clientY - sy) / stageRect.height * 100;
        layer.x = Math.max(15, Math.min(85, lx0 + dxPct));
        layer.y = Math.max(15, Math.min(88, ly0 + dyPct));
        img.style.left = layer.x + '%';
        img.style.top = layer.y + '%';
        hit.style.left = layer.x + '%';
        hit.style.top = layer.y + '%';
      };
      const onUp = () => {
        hit.removeEventListener('pointermove', onMove);
        hit.removeEventListener('pointerup', onUp);
        hit.removeEventListener('pointercancel', onUp);
      };
      hit.addEventListener('pointermove', onMove);
      hit.addEventListener('pointerup', onUp);
      hit.addEventListener('pointercancel', onUp);
    });
    hitEl.appendChild(hit);
  });
}

function renderDiyControls() {
  const list = diyState[diySide];
  const active = getActiveLayer();
  const bar = document.getElementById('diyLayersBar');
  if (!list.length) {
    bar.innerHTML = `<span style="font-size:12px;color:var(--muted);">当前面为空白，点下方任意印花即可放上衣服</span>`;
  } else {
    bar.innerHTML = `<span style="font-size:11.5px;color:var(--muted);margin-right:2px;">当前面图层：</span>` +
      list.map((l, idx) => `
        <button class="layer-pill ${active && active.uid === l.uid ? 'active' : ''}" onclick="selectDiyLayer(${l.uid})">
          ${idx + 1}. ${l.label}
        </button>
      `).join('');
  }

  const ctrl = document.getElementById('diyCtrl');
  ctrl.style.opacity = active ? '1' : '0.4';
  ctrl.style.pointerEvents = active ? 'auto' : 'none';
  if (active) {
    document.getElementById('diyScaleSlider').value = Math.round(active.w);
    document.getElementById('diyScaleVal').textContent = Math.round(active.w) + '%';
    const bBtn = document.getElementById('diyBlendBtn');
    bBtn.style.display = active.custom ? 'inline-block' : 'none';
    bBtn.textContent = active.blend === 'multiply' ? '去白底：开' : '去白底：关';
    bBtn.classList.toggle('on', active.blend === 'multiply');
  }
}

function selectDiyLayer(uid) {
  diySel[diySide] = uid;
  renderDiyBoard(diySide);
  renderDiyControls();
}

function onDiyScale(v) {
  const active = getActiveLayer();
  if (!active) return;
  active.w = Number(v);
  document.getElementById('diyScaleVal').textContent = Math.round(active.w) + '%';
  renderDiyBoard(diySide);
}

function applyDiyPreset(kind) {
  const active = getActiveLayer();
  if (!active) return;
  if (kind === 'pocket') { active.w = 15; active.x = 61; active.y = 33; }
  else if (kind === 'mid') { active.w = 34; active.x = 50; active.y = 36; }
  else if (kind === 'big') { active.w = 45; active.x = 50; active.y = 48; }
  else if (kind === 'center') { active.x = 50; }
  renderDiyBoard(diySide);
  renderDiyControls();
}

function diyToggleFlip() {
  const active = getActiveLayer();
  if (!active) return;
  active.flipX = !active.flipX;
  renderDiyBoard(diySide);
}

function diyToggleBlend() {
  const active = getActiveLayer();
  if (!active) return;
  active.blend = active.blend === 'multiply' ? 'normal' : 'multiply';
  renderDiyBoard(diySide);
  renderDiyControls();
}

function diyRemoveSelected() {
  const active = getActiveLayer();
  if (!active) return;
  diyState[diySide] = diyState[diySide].filter(l => l.uid !== active.uid);
  diySel[diySide] = diyState[diySide].length ? diyState[diySide][diyState[diySide].length - 1].uid : null;
  renderDiyBoard(diySide);
  renderDiyControls();
}

function diyClearSide() {
  diyState[diySide] = [];
  diySel[diySide] = null;
  renderDiyBoard(diySide);
  renderDiyControls();
}

function diyRandomMix() {
  const fronts = DIY_ASSETS.filter(a => a.cat === '人像' || a.cat === '小草');
  const backs = DIY_ASSETS.filter(a => a.cat === '小草' || a.cat === '以太');
  const fA = fronts[Math.floor(Math.random() * fronts.length)];
  const bA = backs[Math.floor(Math.random() * backs.length)];
  const lF = createLayerFromAsset(fA);
  if (fA.cat === '小草') { lF.w = 18; lF.x = 60; lF.y = 33; }
  const lB = createLayerFromAsset(bA);
  diyState.front = [lF];
  diyState.back = [lB];
  diySel.front = lF.uid;
  diySel.back = lB.uid;
  renderDiyAll();
}

function toggleDiyAddMode() {
  diyAddLayerMode = !diyAddLayerMode;
  const btn = document.getElementById('diyAddModeBtn');
  btn.textContent = diyAddLayerMode ? '点击素材：+ 叠加新图层' : '点击素材：替换当前图';
  btn.classList.toggle('on', diyAddLayerMode);
}

function pickDiyAsset(id) {
  const asset = DIY_ASSETS.find(a => a.id === id);
  if (!asset) return;
  const list = diyState[diySide];
  if (!diyAddLayerMode && list.length) {
    const active = getActiveLayer();
    active.label = asset.label;
    active.src = asset.src;
    active.w = asset.dw;
    active.x = 50;
    active.y = asset.dy;
    active.flipX = false;
    active.blend = 'multiply';
    active.custom = false;
  } else {
    const nl = createLayerFromAsset(asset);
    if (list.length) { nl.w = Math.min(26, asset.dw); nl.y = 66; }
    list.push(nl);
    diySel[diySide] = nl.uid;
  }
  renderDiyBoard(diySide);
  renderDiyControls();
}

function onDiyUpload(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const nl = {
      uid: diyLayerUid++,
      label: file.name.slice(0, 8),
      src: ev.target.result,
      x: 50, y: 42, w: 28,
      flipX: false, blend: 'multiply', custom: true
    };
    if (!diyAddLayerMode && diyState[diySide].length) {
      diyState[diySide] = [nl];
    } else {
      diyState[diySide].push(nl);
    }
    diySel[diySide] = nl.uid;
    renderDiyBoard(diySide);
    renderDiyControls();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function renderDiyShelf() {
  const cats = ['全部', '人像', '小草', '以太'];
  document.getElementById('diyCats').innerHTML = cats.map(c =>
    `<button class="diy-chip ${diyCat === c ? 'on' : ''}" onclick="diyCat='${c}';renderDiyShelf()">${c}</button>`
  ).join('');

  const filtered = diyCat === '全部' ? DIY_ASSETS : DIY_ASSETS.filter(a => a.cat === diyCat);
  const grid = document.getElementById('diyGrid');
  grid.innerHTML = filtered.map(a => `
    <button class="diy-asset" onclick="pickDiyAsset('${a.id}')">
      <img src="${a.src}" alt="${a.label}" loading="lazy" />
      <span>${a.label}</span>
    </button>
  `).join('') + `
    <button class="diy-asset diy-upload-card" onclick="document.getElementById('diyFileInput').click()">
      <span style="font-size:20px;line-height:1;">+</span>
      <span>上传自己的图</span>
    </button>
  `;
}

function renderDiyAll() {
  renderDiyBoard('front');
  renderDiyBoard('back');
  renderDiyControls();
  renderDiyShelf();
}

function loadImgAsync(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.crossOrigin = 'anonymous';
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = src;
  });
}

async function exportDiyImage() {
  const btn = document.getElementById('diyExportBtn');
  const oldTxt = btn.textContent;
  btn.textContent = '生成中…';
  btn.disabled = true;
  try {
    const S = 1000, GAP = 24, PAD = 28;
    const out = document.createElement('canvas');
    out.width = S * 2 + GAP + PAD * 2;
    out.height = S + PAD * 2 + 28;
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#f5f3ef';
    ctx.fillRect(0, 0, out.width, out.height);

    const sides = [
      { key: 'front', base: BLANK.front, mask: BLANK.maskF, ox: PAD, label: 'FRONT' },
      { key: 'back',  base: BLANK.back,  mask: BLANK.maskB, ox: PAD + S + GAP, label: 'BACK' }
    ];

    for (const sd of sides) {
      const [baseIm, maskIm] = await Promise.all([loadImgAsync(sd.base), loadImgAsync(sd.mask)]);
      ctx.drawImage(baseIm, sd.ox, PAD, S, S);

      for (const blendMode of ['multiply', 'normal']) {
        const layers = diyState[sd.key].filter(l => l.blend === blendMode);
        if (!layers.length) continue;
        const off = document.createElement('canvas');
        off.width = S; off.height = S;
        const octx = off.getContext('2d');
        for (const l of layers) {
          const pim = await loadImgAsync(l.src);
          const pw = (l.w / 100) * S;
          const ph = pw * (pim.naturalHeight / Math.max(1, pim.naturalWidth));
          const cx = (l.x / 100) * S;
          const cy = (l.y / 100) * S;
          octx.save();
          octx.translate(cx, cy);
          if (l.flipX) octx.scale(-1, 1);
          octx.drawImage(pim, -pw / 2, -ph / 2, pw, ph);
          octx.restore();
        }
        octx.globalCompositeOperation = 'destination-in';
        octx.drawImage(maskIm, 0, 0, S, S);

        ctx.save();
        ctx.globalCompositeOperation = blendMode === 'multiply' ? 'multiply' : 'source-over';
        ctx.drawImage(off, sd.ox, PAD);
        ctx.restore();
      }
      ctx.fillStyle = '#93918a';
      ctx.font = '13px -apple-system, sans-serif';
      ctx.fillText(sd.label, sd.ox + 2, PAD + S + 20);
    }

    const a = document.createElement('a');
    a.download = 'diy-tee-' + Date.now().toString().slice(-5) + '.jpg';
    a.href = out.toDataURL('image/jpeg', 0.92);
    a.click();
  } catch (err) {
    alert('导出失败：' + err);
  } finally {
    btn.textContent = oldTxt;
    btn.disabled = false;
  }
}

document.addEventListener('keydown', e => {
  if (lb.classList.contains('open')) {
    if (e.key === 'Escape') closeLb();
    else if (e.key === '+' || e.key === '=') stepZoom(1);
    else if (e.key === '-' || e.key === '_') stepZoom(-1);
    else if (e.key === '0') resetZoom(true);
    else if (e.key === 'ArrowLeft') setLbSide('front');
    else if (e.key === 'ArrowRight') setLbSide('back');
    return;
  }
  if (appMode === 'vote' && viewMode === 'pair') {
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
  }
});

window.addEventListener('resize', renderSteps);

initDiyDefault();
renderStage();
renderStarred();
</script>
