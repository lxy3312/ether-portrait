<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>01 — 10</title>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --studio: #f1f0ec;
    --ink: #171715;
    --ink-soft: #575650;
    --muted: #93918a;
    --line: rgba(23, 23, 21, 0.08);
    --line-strong: rgba(23, 23, 21, 0.16);
    --gold: #cf9619;
    --gold-soft: #faf3e0;
    --gold-border: #e5cb8b;
    --radius-card: 20px;
    --radius-tile: 13px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 120px;
  }

  /* Quiet Editorial Top Bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(246, 245, 241, 0.84);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 13px 28px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }
  .brand {
    font-family: "Georgia", "Times New Roman", serif;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.22em;
    color: var(--ink);
    white-space: nowrap;
  }
  .steps {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(23, 23, 21, 0.04);
    padding: 4px;
    border-radius: 999px;
  }
  .step-pill {
    position: relative;
    height: 30px;
    padding: 0 13px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .step-pill:hover { color: var(--ink); }
  .step-pill.active {
    background: var(--ink);
    color: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
  }
  .step-pill.has-star::after {
    content: "";
    position: absolute;
    top: 4px;
    right: 5px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
  }
  .top-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .ghost-btn {
    height: 32px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: rgba(255, 255, 255, 0.65);
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .ghost-btn:hover {
    background: #fff;
    color: var(--ink);
    border-color: rgba(23, 23, 21, 0.3);
  }
  .ghost-btn.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .star-counter-btn {
    height: 32px;
    padding: 0 13px;
    border-radius: 999px;
    border: 1px solid var(--gold-border);
    background: var(--gold-soft);
    color: #8c6207;
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .star-counter-btn:hover { background: #f8eccb; }

  /* Gallery Stage */
  .stage {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 28px 18px;
  }
  .pair-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 30px;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 20px 24px 24px;
    box-shadow: 0 2px 14px rgba(23, 23, 21, 0.03);
    transition: box-shadow 0.28s ease, border-color 0.28s ease;
    animation: cardIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .card:nth-child(2) { animation-delay: 0.05s; }
  .card:hover {
    box-shadow: 0 12px 34px rgba(23, 23, 21, 0.06);
  }
  .card.starred {
    border-color: var(--gold-border);
    box-shadow: 0 14px 38px rgba(207, 150, 25, 0.10);
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding: 0 2px;
  }
  .num-wrap {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .num {
    font-family: "Georgia", "Times New Roman", serif;
    font-size: 32px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .card.starred .num {
    color: #9c6e0a;
  }

  /* Tactile Star Button */
  @keyframes starPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.24); }
    100% { transform: scale(1); }
  }
  .star-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: #fff;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .star-btn:hover {
    border-color: rgba(23, 23, 21, 0.32);
    transform: scale(1.06);
  }
  .star-btn:active { transform: scale(0.91); }
  .star-btn svg {
    width: 21px;
    height: 21px;
    stroke: #9c9a92;
    fill: none;
    stroke-width: 1.55;
    transition: all 0.22s ease;
  }
  .star-btn.on {
    border-color: var(--gold-border);
    background: var(--gold-soft);
    box-shadow: 0 4px 14px rgba(207, 150, 25, 0.18);
  }
  .star-btn.on svg {
    stroke: var(--gold);
    fill: var(--gold);
  }
  .star-btn.pop svg { animation: starPop 0.32s cubic-bezier(0.22, 1, 0.36, 1); }

  /* Seamless Studio Garment Pair */
  .tee-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .tee-box {
    position: relative;
    background: var(--studio);
    border-radius: var(--radius-tile);
    overflow: hidden;
    aspect-ratio: 1 / 1;
    cursor: zoom-in;
  }
  .tee-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .tee-box:hover img { transform: scale(1.03); }
  .side-tag {
    position: absolute;
    bottom: 12px;
    left: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.16em;
    color: var(--ink-soft);
    pointer-events: none;
  }
  .zoom-hint {
    position: absolute;
    bottom: 12px;
    right: 12px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    opacity: 0;
    transform: scale(0.92);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  .tee-box:hover .zoom-hint {
    opacity: 1;
    transform: scale(1);
  }

  /* Pair Step Pager */
  .pager {
    margin-top: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .nav-btn {
    height: 50px;
    padding: 0 30px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .nav-prev {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line-strong);
  }
  .nav-prev:hover:not(:disabled) {
    border-color: var(--ink);
    transform: translateX(-2px);
  }
  .nav-prev:disabled { opacity: 0.28; cursor: default; }
  .nav-next {
    background: var(--ink);
    color: #fff;
    border: 1px solid var(--ink);
    box-shadow: 0 6px 18px rgba(23, 23, 21, 0.14);
  }
  .nav-next:hover {
    background: #2b2b27;
    transform: translateX(2px);
  }
  .page-meta {
    font-family: "Georgia", "Times New Roman", serif;
    font-size: 15px;
    letter-spacing: 0.14em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Bottom Starred Summary */
  .starred-section {
    max-width: 1280px;
    margin: 44px auto 0;
    padding: 34px 28px 0;
    border-top: 1px solid var(--line);
  }
  .starred-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .starred-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
  .starred-title svg {
    width: 17px;
    height: 17px;
    fill: var(--gold);
    stroke: var(--gold);
  }
  .starred-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .copy-btn {
    height: 36px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .copy-btn:hover:not(:disabled) { background: #2d2d29; }
  .copy-btn:disabled { opacity: 0.22; cursor: default; }
  .starred-empty {
    font-size: 13px;
    color: var(--muted);
    padding: 28px 0;
    letter-spacing: 0.03em;
  }
  .starred-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
    gap: 16px;
  }
  .mini-card {
    background: #fff;
    border: 1px solid var(--gold-border);
    border-radius: 14px;
    padding: 13px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .mini-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(207, 150, 25, 0.12);
  }
  .mini-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 9px;
  }
  .mini-num {
    font-family: "Georgia", "Times New Roman", serif;
    font-size: 19px;
    letter-spacing: 0.05em;
  }
  .mini-rm {
    background: none;
    border: none;
    color: var(--gold);
    font-size: 17px;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
  }
  .mini-imgs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }
  .mini-imgs img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    border-radius: 8px;
    background: var(--studio);
  }

  /* Floating Bottom Starred Dock */
  .dock {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 60;
    background: rgba(23, 23, 21, 0.90);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: #fff;
    padding: 9px 10px 9px 18px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
    font-size: 13px;
    max-width: 92vw;
    white-space: nowrap;
    overflow-x: auto;
  }
  .dock-star { color: #f0bc3a; font-size: 15px; }
  .dock-nums { display: flex; gap: 6px; align-items: center; }
  .dock-pill {
    background: rgba(255, 255, 255, 0.14);
    padding: 3px 10px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .dock-pill:hover { background: rgba(255, 255, 255, 0.26); }
  .dock-copy {
    background: #fff;
    color: var(--ink);
    border: none;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 4px;
    transition: opacity 0.15s ease;
  }
  .dock-copy:hover { opacity: 0.9; }

  /* =======================================================================
     Deep Multi-Level Zoom Lightbox (放大再放大 + 拖拽 + 滚轮 + 双指 + 印花原图)
     ======================================================================= */
  .lb {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #f4f3ef;
    display: none;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .lb.open { display: flex; }
  .lb.detail-mode { background: #ffffff; }

  .lb-top {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: rgba(244, 243, 239, 0.84);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .lb.detail-mode .lb-top {
    background: rgba(255, 255, 255, 0.88);
  }
  .lb-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .lb-id {
    font-family: "Georgia", "Times New Roman", serif;
    font-size: 22px;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
  .lb-seg {
    display: inline-flex;
    background: rgba(23, 23, 21, 0.06);
    padding: 3px;
    border-radius: 999px;
    gap: 2px;
  }
  .lb-seg button {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .lb-seg button.active {
    background: #fff;
    color: var(--ink);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
  }
  .lb-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lb-icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.16s ease;
  }
  .lb-icon-btn:hover { border-color: var(--ink); }
  .lb-icon-btn.star-on {
    border-color: var(--gold-border);
    background: var(--gold-soft);
    color: var(--gold);
  }
  .lb-icon-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
  }
  .lb-icon-btn.star-on svg { fill: var(--gold); stroke: var(--gold); }

  /* Interactive Pan & Zoom Viewport */
  .lb-viewport {
    position: relative;
    flex: 1;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: zoom-in;
  }
  .lb-viewport.zoomed { cursor: grab; }
  .lb-viewport.dragging { cursor: grabbing; }
  .lb-canvas {
    transform-origin: center center;
    will-change: transform;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lb-canvas.smooth {
    transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .lb-canvas img {
    max-width: 92vw;
    max-height: calc(100vh - 156px);
    width: auto;
    height: auto;
    display: block;
    pointer-events: none;
    border-radius: 6px;
  }

  /* Floating Bottom Zoom Control Dock */
  .lb-bar {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 999px;
    background: rgba(23, 23, 21, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: #fff;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
    max-width: 94vw;
  }
  .z-group {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .z-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }
  .z-btn:hover { background: rgba(255, 255, 255, 0.16); }
  .z-readout {
    min-width: 54px;
    height: 30px;
    padding: 0 8px;
    border-radius: 999px;
    border: none;
    background: rgba(255, 255, 255, 0.10);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .z-readout:hover { background: rgba(255, 255, 255, 0.22); }
  .lb-div {
    width: 1px;
    height: 18px;
    background: rgba(255, 255, 255, 0.18);
  }
  .view-pill {
    display: inline-flex;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    padding: 2px;
    gap: 2px;
  }
  .view-pill button {
    height: 30px;
    padding: 0 13px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.72);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s ease;
  }
  .view-pill button.active {
    background: #fff;
    color: var(--ink);
  }

  /* Mobile Refinement */
  @media (max-width: 760px) {
    .topbar-inner {
      padding: 11px 14px;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
    }
    .brand { font-size: 13px; letter-spacing: 0.14em; }
    .steps { justify-self: center; gap: 2px; padding: 3px; }
    .step-pill { height: 26px; padding: 0 8px; font-size: 11px; }
    .ghost-btn { height: 28px; padding: 0 10px; font-size: 11px; }
    .star-counter-btn { height: 28px; padding: 0 9px; font-size: 11px; }
    .stage { padding: 18px 12px 12px; }
    .pair-grid { gap: 18px; }
    .card { padding: 14px 12px 16px; border-radius: 16px; }
    .card-head { margin-bottom: 11px; }
    .num { font-size: 25px; }
    .star-btn { width: 38px; height: 38px; }
    .star-btn svg { width: 19px; height: 19px; }
    .tee-pair { gap: 8px; }
    .tee-box { border-radius: 10px; }
    .side-tag { bottom: 7px; left: 7px; padding: 3px 7px; font-size: 9px; }
    .zoom-hint { display: none; }
    .nav-btn { height: 44px; padding: 0 20px; font-size: 13px; }
    .starred-section { padding: 26px 12px 0; }
    .lb-top { padding: 10px 14px; }
    .lb-id { font-size: 18px; }
    .lb-bar { bottom: 16px; padding: 5px 7px; gap: 6px; }
    .z-btn { width: 30px; height: 30px; font-size: 16px; }
    .view-pill button { padding: 0 10px; font-size: 11px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">01 — 10</div>
    <div class="steps" id="steps"></div>
    <div class="top-actions">
      <button class="star-counter-btn" id="starJumpBtn" onclick="scrollToStarred()" style="display:none;">★ <span id="topStarNum">0</span></button>
      <button class="ghost-btn" id="modeBtn" onclick="toggleMode()">全部</button>
    </div>
  </div>
</header>

<main class="stage">
  <div class="pair-grid" id="stageGrid"></div>

  <div class="pager" id="pager">
    <button class="nav-btn nav-prev" id="prevBtn" onclick="go(-1)">← 上一组</button>
    <div class="page-meta" id="pageMeta">1 / 5</div>
    <button class="nav-btn nav-next" id="nextBtn" onclick="go(1)">下一组 →</button>
  </div>
</main>

<section class="starred-section" id="starredSection">
  <div class="starred-head">
    <div class="starred-title">
      <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span id="starredCount">已收藏 0 款</span>
    </div>
    <div class="starred-actions">
      <button class="ghost-btn" id="onlyStarBtn" onclick="toggleOnlyStarred()" style="display:none;">仅看已收藏</button>
      <button class="copy-btn" id="copyBtn" onclick="copyStarred()" disabled>复制编号</button>
    </div>
  </div>
  <div id="starredBody"></div>
</section>

<div class="dock" id="dock" style="display:none;">
  <span class="dock-star">★</span>
  <div class="dock-nums" id="dockNums"></div>
  <button class="dock-copy" onclick="copyStarred()" id="dockCopyBtn">复制</button>
</div>

<!-- Deep Multi-Level Zoom Lightbox -->
<div class="lb" id="lb">
  <div class="lb-top">
    <div class="lb-left">
      <span class="lb-id" id="lbId">01</span>
      <div class="lb-seg">
        <button id="lbFrontBtn" onclick="setLbSide('front')">FRONT</button>
        <button id="lbBackBtn" onclick="setLbSide('back')">BACK</button>
      </div>
    </div>
    <div class="lb-right">
      <button class="lb-icon-btn" id="lbStarBtn" onclick="toggleLbStar()" title="收藏">
        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </button>
      <button class="lb-icon-btn" onclick="closeLb()" title="关闭">✕</button>
    </div>
  </div>

  <div class="lb-viewport" id="lbViewport">
    <div class="lb-canvas" id="lbCanvas">
      <img id="lbImg" src="" alt="" draggable="false" />
    </div>
  </div>

  <div class="lb-bar">
    <div class="z-group">
      <button class="z-btn" onclick="stepZoom(-1)" title="缩小">−</button>
      <button class="z-readout" id="zReadout" onclick="resetZoom(true)" title="点击还原">100%</button>
      <button class="z-btn" onclick="stepZoom(1)" title="放大">+</button>
    </div>
    <div class="lb-div"></div>
    <div class="view-pill">
      <button id="viewTeeBtn" class="active" onclick="setLbDetail(false)">成衣</button>
      <button id="viewDetBtn" onclick="setLbDetail(true)">印花细节</button>
    </div>
  </div>
</div>

<script>
const ITEMS = [
  { id: "01", front: "vote-img/front_base.jpg", back: "vote-img/01_b.jpg", frontDetail: "vote-img/d_front_base.jpg", backDetail: "vote-img/d_01_b.jpg" },
  { id: "02", front: "vote-img/front_base.jpg", back: "vote-img/02_b.jpg", frontDetail: "vote-img/d_front_base.jpg", backDetail: "vote-img/d_02_b.jpg" },
  { id: "03", front: "vote-img/front_base.jpg", back: "vote-img/03_b.jpg", frontDetail: "vote-img/d_front_base.jpg", backDetail: "vote-img/d_03_b.jpg" },
  { id: "04", front: "vote-img/front_base.jpg", back: "vote-img/04_b.jpg", frontDetail: "vote-img/d_front_base.jpg", backDetail: "vote-img/d_04_b.jpg" },
  { id: "05", front: "vote-img/front_base.jpg", back: "vote-img/05_b.jpg", frontDetail: "vote-img/d_front_base.jpg", backDetail: "vote-img/d_05_b.jpg" },
  { id: "06", front: "vote-img/front_base.jpg", back: "vote-img/06_b.jpg", frontDetail: "vote-img/d_front_base.jpg", backDetail: "vote-img/d_06_b.jpg" },
  { id: "07", front: "vote-img/07_f.jpg", back: "vote-img/06_b.jpg", frontDetail: "vote-img/d_07_f.jpg", backDetail: "vote-img/d_06_b.jpg" },
  { id: "08", front: "vote-img/08_f.jpg", back: "vote-img/08_b.jpg", frontDetail: "vote-img/d_08_f.jpg", backDetail: "vote-img/d_08_b.jpg" },
  { id: "09", front: "vote-img/front_base.jpg", back: "vote-img/09_b.jpg", frontDetail: "vote-img/d_front_base.jpg", backDetail: "vote-img/d_09_b.jpg" },
  { id: "10", front: "vote-img/front_base.jpg", back: "vote-img/10_b.jpg", frontDetail: "vote-img/d_front_base.jpg", backDetail: "vote-img/d_10_b.jpg" }
];

const STAR_SVG = `<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
const ZOOM_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>`;

let page = 0;          // 0..4 (2 items per page)
let viewMode = 'pair'; // 'pair' | 'all' | 'starred'
let starred = new Set(JSON.parse(localStorage.getItem('lily_tee_stars') || '[]'));

function saveStars() {
  localStorage.setItem('lily_tee_stars', JSON.stringify([...starred]));
}

function renderSteps() {
  const el = document.getElementById('steps');
  if (viewMode !== 'pair') {
    el.style.visibility = 'hidden';
    return;
  }
  el.style.visibility = 'visible';
  const labels = ['01–02', '03–04', '05–06', '07–08', '09–10'];
  const shortLabels = ['1', '2', '3', '4', '5'];
  const mobile = window.innerWidth <= 760;
  el.innerHTML = [0,1,2,3,4].map(i => {
    const pairIds = [ITEMS[i*2].id, ITEMS[i*2+1].id];
    const hasStar = pairIds.some(id => starred.has(id));
    return `<button class="step-pill ${i === page ? 'active' : ''} ${hasStar ? 'has-star' : ''}" onclick="jump(${i})">${mobile ? shortLabels[i] : labels[i]}</button>`;
  }).join('');
}

function cardHTML(item, popId) {
  const isStar = starred.has(item.id);
  return `
    <article class="card ${isStar ? 'starred' : ''}" id="card-${item.id}">
      <div class="card-head">
        <div class="num-wrap"><div class="num">${item.id}</div></div>
        <button class="star-btn ${isStar ? 'on' : ''} ${popId === item.id ? 'pop' : ''}" aria-label="Star ${item.id}" onclick="toggleStar('${item.id}')">
          ${STAR_SVG}
        </button>
      </div>
      <div class="tee-pair">
        <div class="tee-box" onclick="openLb('${item.id}', 'front')">
          <img src="${item.front}" alt="${item.id} front" loading="eager" />
          <span class="side-tag">FRONT</span>
          <span class="zoom-hint">${ZOOM_SVG}</span>
        </div>
        <div class="tee-box" onclick="openLb('${item.id}', 'back')">
          <img src="${item.back}" alt="${item.id} back" loading="eager" />
          <span class="side-tag">BACK</span>
          <span class="zoom-hint">${ZOOM_SVG}</span>
        </div>
      </div>
    </article>
  `;
}

function renderStage(popId = null) {
  const grid = document.getElementById('stageGrid');
  const pager = document.getElementById('pager');
  let slice;
  if (viewMode === 'all') slice = ITEMS;
  else if (viewMode === 'starred') {
    slice = ITEMS.filter(x => starred.has(x.id));
    if (!slice.length) { viewMode = 'pair'; slice = ITEMS.slice(page * 2, page * 2 + 2); }
  } else {
    slice = ITEMS.slice(page * 2, page * 2 + 2);
  }
  grid.innerHTML = slice.map(item => cardHTML(item, popId)).join('');
  pager.style.display = (viewMode === 'pair') ? 'flex' : 'none';
  document.getElementById('prevBtn').disabled = (page === 0);
  document.getElementById('nextBtn').textContent = (page === 4) ? '查看已收藏 ↓' : '下一组 →';
  document.getElementById('pageMeta').textContent = `${page + 1} / 5`;

  const modeBtn = document.getElementById('modeBtn');
  modeBtn.textContent = (viewMode === 'all') ? '两组' : '全部';
  modeBtn.classList.toggle('active', viewMode === 'all');

  const onlyBtn = document.getElementById('onlyStarBtn');
  onlyBtn.classList.toggle('active', viewMode === 'starred');
  onlyBtn.textContent = (viewMode === 'starred') ? '返回两组' : '仅看已收藏';
  renderSteps();
}

function renderStarred() {
  const list = ITEMS.filter(x => starred.has(x.id));
  document.getElementById('starredCount').textContent = `已收藏 ${list.length} 款`;
  document.getElementById('copyBtn').disabled = (list.length === 0);
  const topBtn = document.getElementById('starJumpBtn');
  topBtn.style.display = list.length ? 'inline-flex' : 'none';
  document.getElementById('topStarNum').textContent = list.length;
  document.getElementById('onlyStarBtn').style.display = (list.length >= 2 || viewMode === 'starred') ? 'inline-flex' : 'none';

  const body = document.getElementById('starredBody');
  const dock = document.getElementById('dock');
  if (list.length === 0) {
    body.innerHTML = `<div class="starred-empty">点亮右上角 ★ 即可收藏对比</div>`;
    dock.style.display = 'none';
    return;
  }
  body.innerHTML = `<div class="starred-grid">` + list.map(item => `
    <div class="mini-card" onclick="openLb('${item.id}', 'back')">
      <div class="mini-top">
        <span class="mini-num">${item.id}</span>
        <button class="mini-rm" title="取消收藏" onclick="event.stopPropagation(); toggleStar('${item.id}')">★</button>
      </div>
      <div class="mini-imgs">
        <img src="${item.front}" alt="${item.id} front" />
        <img src="${item.back}" alt="${item.id} back" />
      </div>
    </div>
  `).join('') + `</div>`;

  dock.style.display = 'flex';
  document.getElementById('dockNums').innerHTML = list.map(item =>
    `<span class="dock-pill" onclick="jumpToItem('${item.id}')">${item.id}</span>`
  ).join('');
}

function toggleStar(id) {
  if (starred.has(id)) starred.delete(id);
  else starred.add(id);
  saveStars();
  renderStage(id);
  renderStarred();
  syncLbStar();
}

function jump(p) {
  viewMode = 'pair';
  page = Math.max(0, Math.min(4, p));
  renderStage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function go(delta) {
  if (delta > 0 && page === 4) {
    scrollToStarred();
    return;
  }
  jump(page + delta);
}

function scrollToStarred() {
  document.getElementById('starredSection').scrollIntoView({ behavior: 'smooth' });
}

function jumpToItem(id) {
  const idx = ITEMS.findIndex(x => x.id === id);
  if (idx < 0) return;
  if (viewMode === 'pair') {
    page = Math.floor(idx / 2);
    renderStage();
  }
  setTimeout(() => {
    const el = document.getElementById('card-' + id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 50);
}

function toggleMode() {
  viewMode = (viewMode === 'all') ? 'pair' : 'all';
  renderStage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleOnlyStarred() {
  viewMode = (viewMode === 'starred') ? 'pair' : 'starred';
  renderStage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function copyStarred() {
  const ids = ITEMS.filter(x => starred.has(x.id)).map(x => x.id);
  if (!ids.length) return;
  const text = '★ ' + ids.join('、');
  navigator.clipboard.writeText(text).then(() => {
    const b1 = document.getElementById('copyBtn');
    const b2 = document.getElementById('dockCopyBtn');
    b1.textContent = '已复制'; b2.textContent = '已复制';
    setTimeout(() => { b1.textContent = '复制编号'; b2.textContent = '复制'; }, 1400);
  }).catch(() => alert(text));
}

// =========================================================================
// Deep Multi-Level Zoom & Pan Engine (1x -> 2.2x -> 4x -> 6x + Wheel + Pinch)
// =========================================================================
const lb = document.getElementById('lb');
const lbViewport = document.getElementById('lbViewport');
const lbCanvas = document.getElementById('lbCanvas');
const lbImg = document.getElementById('lbImg');
const zReadout = document.getElementById('zReadout');

const ZOOM_STEPS = [1, 2.2, 4, 6];
let lbItemId = '01';
let lbSide = 'back';
let lbDetail = false;
let scale = 1, tx = 0, ty = 0;

function clampPan() {
  if (scale <= 1.01) { tx = 0; ty = 0; return; }
  const baseW = lbImg.offsetWidth || lbViewport.clientWidth;
  const baseH = lbImg.offsetHeight || lbViewport.clientHeight;
  const vw = lbViewport.clientWidth;
  const vh = lbViewport.clientHeight;
  const maxX = Math.max(0, (baseW * scale - vw) / 2 + 48);
  const maxY = Math.max(0, (baseH * scale - vh) / 2 + 48);
  tx = Math.max(-maxX, Math.min(maxX, tx));
  ty = Math.max(-maxY, Math.min(maxY, ty));
}

function applyTransform(smooth = false) {
  clampPan();
  lbCanvas.classList.toggle('smooth', smooth);
  lbCanvas.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
  zReadout.textContent = Math.round(scale * 100) + '%';
  lbViewport.classList.toggle('zoomed', scale > 1.02);
}

function zoomTo(targetScale, clientX = null, clientY = null, smooth = true) {
  const next = Math.max(1, Math.min(6, targetScale));
  if (next <= 1.01) {
    scale = 1; tx = 0; ty = 0;
    applyTransform(smooth);
    return;
  }
  if (clientX !== null && clientY !== null) {
    const vr = lbViewport.getBoundingClientRect();
    const ox = clientX - (vr.left + vr.width / 2);
    const oy = clientY - (vr.top + vr.height / 2);
    const ratio = next / scale;
    tx = ox - (ox - tx) * ratio;
    ty = oy - (oy - ty) * ratio;
  }
  scale = next;
  applyTransform(smooth);
}

function resetZoom(smooth = true) { zoomTo(1, null, null, smooth); }

function stepZoom(dir, clientX = null, clientY = null) {
  if (dir > 0) {
    const next = ZOOM_STEPS.find(s => s > scale + 0.15);
    zoomTo(next || 6, clientX, clientY, true);
  } else {
    const prev = [...ZOOM_STEPS].reverse().find(s => s < scale - 0.15);
    zoomTo(prev || 1, clientX, clientY, true);
  }
}

function cycleTapZoom(clientX, clientY) {
  if (scale < 1.8) zoomTo(2.2, clientX, clientY, true);
  else if (scale < 3.4) zoomTo(4, clientX, clientY, true);
  else if (scale < 5.2) zoomTo(6, clientX, clientY, true);
  else resetZoom(true);
}

function syncLbUI() {
  const item = ITEMS.find(x => x.id === lbItemId);
  if (!item) return;
  document.getElementById('lbId').textContent = item.id;
  document.getElementById('lbFrontBtn').classList.toggle('active', lbSide === 'front');
  document.getElementById('lbBackBtn').classList.toggle('active', lbSide === 'back');
  document.getElementById('viewTeeBtn').classList.toggle('active', !lbDetail);
  document.getElementById('viewDetBtn').classList.toggle('active', lbDetail);
  lb.classList.toggle('detail-mode', lbDetail);
  const src = lbDetail
    ? (lbSide === 'front' ? item.frontDetail : item.backDetail)
    : (lbSide === 'front' ? item.front : item.back);
  if (lbImg.getAttribute('src') !== src) {
    lbImg.src = src;
  }
  syncLbStar();
}

function syncLbStar() {
  document.getElementById('lbStarBtn').classList.toggle('star-on', starred.has(lbItemId));
}

function openLb(id, side) {
  lbItemId = id;
  lbSide = side;
  lbDetail = false;
  resetZoom(false);
  syncLbUI();
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLb() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
  resetZoom(false);
}

function setLbSide(side) {
  if (lbSide === side) return;
  lbSide = side;
  resetZoom(false);
  syncLbUI();
}

function setLbDetail(isDet) {
  if (lbDetail === isDet) return;
  lbDetail = isDet;
  resetZoom(false);
  syncLbUI();
}

function toggleLbStar() { toggleStar(lbItemId); }

// Mouse Wheel Continuous Cursor-Anchored Zoom
lbViewport.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.24 : 1 / 1.24;
  zoomTo(scale * factor, e.clientX, e.clientY, false);
}, { passive: false });

// Unified Pointer Drag + Click-to-Zoom + Pinch-to-Zoom
const pointers = new Map();
let dragStart = null;
let movedDist = 0;
let pinchStartDist = 0;
let pinchStartScale = 1;
let pinchMid = { x: 0, y: 0 };

lbViewport.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  lbViewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    dragStart = { x: e.clientX, y: e.clientY, tx, ty };
    movedDist = 0;
    if (scale > 1.02) lbViewport.classList.add('dragging');
  } else if (pointers.size === 2) {
    const pts = [...pointers.values()];
    pinchStartDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
    pinchStartScale = scale;
    pinchMid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    dragStart = null;
  }
});

lbViewport.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinchStartDist > 0) {
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
    const midX = (pts[0].x + pts[1].x) / 2;
    const midY = (pts[0].y + pts[1].y) / 2;
    zoomTo(pinchStartScale * (dist / pinchStartDist), midX, midY, false);
    return;
  }
  if (pointers.size === 1 && dragStart) {
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    movedDist = Math.max(movedDist, Math.hypot(dx, dy));
    if (scale > 1.02) {
      tx = dragStart.tx + dx;
      ty = dragStart.ty + dy;
      applyTransform(false);
    }
  }
});

function endPointer(e) {
  const wasSingle = (pointers.size === 1 && dragStart);
  pointers.delete(e.pointerId);
  lbViewport.classList.remove('dragging');
  if (pointers.size < 2) pinchStartDist = 0;
  if (wasSingle && movedDist < 7) {
    // Clean click/tap -> step zoom deeper (放大再放大!)
    cycleTapZoom(e.clientX, e.clientY);
  }
  if (pointers.size === 0) dragStart = null;
}

lbViewport.addEventListener('pointerup', endPointer);
lbViewport.addEventListener('pointercancel', endPointer);

document.addEventListener('keydown', e => {
  if (lb.classList.contains('open')) {
    if (e.key === 'Escape') closeLb();
    else if (e.key === '+' || e.key === '=') stepZoom(1);
    else if (e.key === '-' || e.key === '_') stepZoom(-1);
    else if (e.key === '0') resetZoom(true);
    else if (e.key === 'ArrowLeft') setLbSide('front');
    else if (e.key === 'ArrowRight') setLbSide('back');
    return;
  }
  if (viewMode === 'pair') {
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
  }
});

window.addEventListener('resize', renderSteps);

renderStage();
renderStarred();
</script>
</body>
</html>
