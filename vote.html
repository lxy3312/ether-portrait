  ctx.strokeStyle = 'rgba(74, 59, 50, 0.65)';
  ctx.lineWidth = 1.25;
  ctx.beginPath();
  ctx.moveTo(-16.5, 2.0); ctx.lineTo(-22.5, 0.8);
  ctx.moveTo(-16.5, 5.0); ctx.lineTo(-22.0, 5.8);
  ctx.moveTo(16.5, 2.0);  ctx.lineTo(22.5, 0.8);
  ctx.moveTo(16.5, 5.0);  ctx.lineTo(22.0, 5.8);
  ctx.stroke();

  // Cute little determination sweat-drop while actively climbing!
  if (isClimb) {
    const dropBob = (time * 2.2) % 1;
    ctx.save();
    ctx.globalAlpha = 1 - dropBob * 0.7;
    ctx.fillStyle = '#8ecae6';
    ctx.strokeStyle = '#4c88a8';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(-18, -9 + dropBob * 4);
    ctx.quadraticCurveTo(-21, -4 + dropBob * 4, -18, -3 + dropBob * 4);
    ctx.quadraticCurveTo(-15, -4 + dropBob * 4, -18, -9 + dropBob * 4);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore(); // end head

  // 5. Chubby Front Mittens (drawn in front of body for maximum cuteness!)
  if (isSummit || poke > 0.25) {
    // Raising both little paws joyfully!
    const wave = Math.sin(time * 11) * 0.22;
    drawPaw(-14, 1, -0.75 + wave, true);
    drawPaw(14, 1, 0.75 - wave, true);
  } else if (isClimb) {
    // Alternating climbing grab!
    const reachL = Math.sin(phase) * 7.5;
    const reachR = -Math.sin(phase) * 7.5;
    drawPaw(-11, 3 - reachL, -0.45, true);
    drawPaw(11, 3 - reachR, 0.45, true);
  } else {
    // Idle: cute resting front paws tucked in front
    drawPaw(-7.5, 11, 0.15, false);
    drawPaw(7.5, 11, -0.15, false);
  }

  ctx.restore();
}

function renderCatScene(ts) {
  const bd = document.getElementById('cmBackdrop');
  if (!bd || !bd.classList.contains('open')) {
    catAnimRaf = null;
    return;
  }
  if (!catLastTs) catLastTs = ts;
  const dt = Math.min(0.05, (ts - catLastTs) / 1000);
  catLastTs = ts;
  catTime += dt;
  if (catPokeBoost > 0) catPokeBoost = Math.max(0, catPokeBoost - dt * 2.2);

  // Smooth spring chase toward real download progress
  const prevPct = catSmoothPct;
  catSmoothPct += (catTargetPct - catSmoothPct) * Math.min(1, dt * 8.5);
  if (Math.abs(catTargetPct - catSmoothPct) < 0.002) catSmoothPct = catTargetPct;

  const isClimbing = (cmState === 'running' && catSmoothPct < 0.995) || (catTargetPct - prevPct > 0.004);
  const isSummit = (cmState === 'done' || catSmoothPct >= 0.992);

  // Emit tiny dust puffs while climbing & floating hearts at summit!
  if (isClimbing && Math.random() < dt * 7.5) {
    const pt = cliffPoint(catSmoothPct);
    spawnCatParticle('dust', pt.x - 10, pt.y + 4);
  }
  if (isSummit && Math.random() < dt * 2.6) {
    spawnCatParticle(Math.random() < 0.55 ? 'heart' : 'sparkle', 268 + (Math.random() - 0.5) * 34, 28);
  }

  const canvas = document.getElementById('catCanvas');
  const ctx = canvas.getContext('2d');
  const W = 360, H = 220;
  ctx.save();
  ctx.scale(2, 2); // crisp 2x internal HiDPI (720x440)

  // 1. Warm Sunlit Pastel Sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#eaf3eb');
  sky.addColorStop(0.62, '#f8f6ee');
  sky.addColorStop(1, '#efeae0');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Soft warm sun glow behind summit
  const sun = ctx.createRadialGradient(304, 38, 4, 304, 38, 76);
  sun.addColorStop(0, 'rgba(255, 232, 166, 0.55)');
  sun.addColorStop(1, 'rgba(255, 232, 166, 0)');
  ctx.fillStyle = sun;
  ctx.fillRect(210, 0, 150, 130);

  // Drifting Fluffy Clouds
  const c1x = ((44 + catTime * 4.5) % 410) - 40;
  const c2x = ((176 + catTime * 3.0) % 410) - 40;
  drawCloud(ctx, c1x, 42, 0.92);
  drawCloud(ctx, c2x, 28, 0.72);

  // Soft Distant Rolling Meadow Hills
  ctx.fillStyle = '#dde7d8';
  ctx.beginPath();
  ctx.moveTo(0, 178);
  ctx.quadraticCurveTo(85, 132, 190, 166);
  ctx.quadraticCurveTo(280, 190, 360, 154);
  ctx.lineTo(360, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fill();

  // 2. Cozy Illustrated Climbing Hill / Sandstone Cliff
  ctx.beginPath();
  ctx.moveTo(0, 200);
  ctx.lineTo(44, 188);
  ctx.quadraticCurveTo(164, 118, 264, 66);
  ctx.quadraticCurveTo(295, 58, 360, 62);
  ctx.lineTo(360, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  const rockGrad = ctx.createLinearGradient(80, 110, 320, 220);
  rockGrad.addColorStop(0, '#ebe3d5');
  rockGrad.addColorStop(0.55, '#dfd4c1');
  rockGrad.addColorStop(1, '#d3c6b0');
  ctx.fillStyle = rockGrad;
  ctx.fill();

  // Warm layered rock facet shadow
  ctx.fillStyle = 'rgba(148, 131, 108, 0.16)';
  ctx.beginPath();
  ctx.moveTo(95, H);
  ctx.quadraticCurveTo(195, 146, 286, 86);
  ctx.lineTo(360, 86);
  ctx.lineTo(360, H);
  ctx.closePath();
  ctx.fill();

  // Soft hand-drawn hillside contour line
  ctx.strokeStyle = '#9e8f7b';
  ctx.lineWidth = 2.0;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 200);
  ctx.lineTo(44, 188);
  ctx.quadraticCurveTo(164, 118, 264, 66);
  ctx.quadraticCurveTo(295, 58, 360, 62);
  ctx.stroke();

  // Lush Mossy Cap on the Summit Plateau
  ctx.fillStyle = '#8ec17e';
  ctx.beginPath();
  ctx.moveTo(256, 68);
  ctx.quadraticCurveTo(292, 54, 360, 60);
  ctx.lineTo(360, 74);
  ctx.quadraticCurveTo(324, 70, 304, 76);
  ctx.quadraticCurveTo(278, 70, 256, 73);
  ctx.closePath();
  ctx.fill();

  // Swaying Emerald Grass Blades (Base & Summit)
  const sway = Math.sin(catTime * 2.6) * 2.4;
  ctx.strokeStyle = '#4e9150';
  ctx.lineWidth = 1.9;
  const drawTuft = (bx, by) => {
    ctx.beginPath();
    ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx - 5 + sway * 0.5, by - 11, bx - 8 + sway, by - 17);
    ctx.moveTo(bx + 5, by - 1); ctx.quadraticCurveTo(bx + 5 + sway * 0.6, by - 13, bx + 7 + sway, by - 20);
    ctx.moveTo(bx + 10, by); ctx.quadraticCurveTo(bx + 14 + sway * 0.5, by - 10, bx + 17 + sway, by - 15);
    ctx.stroke();
  };
  drawTuft(16, 198);
  drawTuft(322, 62);

  // Cute Pastel Bouldering Holds along the slope
  CLIFF_HOLDS.forEach(h => {
    const pt = cliffPoint(h.t);
    const hx = pt.x + h.dx, hy = pt.y + h.dy;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(pt.angle * 0.6);
    ctx.fillStyle = 'rgba(74, 59, 50, 0.14)';
    ctx.beginPath(); ctx.ellipse(1, 2.2, h.r, h.r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = h.c;
    ctx.strokeStyle = '#756657';
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.ellipse(0, 0, h.r, h.r * 0.58, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.ellipse(-1.4, -1.1, h.r * 0.4, h.r * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });

  // Dashed Route Trail + Active Emerald Climb Progress Trail
  ctx.save();
  ctx.setLineDash([4, 5]);
  ctx.strokeStyle = 'rgba(74, 59, 50, 0.18)';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(52, 184);
  ctx.quadraticCurveTo(164, 116, 264, 66);
  ctx.stroke();
  ctx.restore();

  if (catSmoothPct > 0.005) {
    ctx.strokeStyle = '#539e5c';
    ctx.lineWidth = 3.0;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const steps = Math.max(4, Math.round(catSmoothPct * 36));
    for (let i = 0; i <= steps; i++) {
      const pt = cliffPoint((i / steps) * catSmoothPct);
      if (i === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
  }

  // 3. Summit Glowing Gold Star
  const starPulse = 1 + Math.sin(catTime * (isSummit ? 6.5 : 3.0)) * (isSummit ? 0.12 : 0.06);
  const starX = 304, starY = 40;
  if (isSummit) {
    const ringPhase = (catTime * 1.1) % 1;
    ctx.strokeStyle = `rgba(240, 186, 54, ${(1 - ringPhase) * 0.75})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(starX, starY, 12 + ringPhase * 20, 0, Math.PI * 2);
    ctx.stroke();
  }
  drawRoundedStar(ctx, starX, starY, 13 * starPulse, 6.5 * starPulse, Math.sin(catTime * 2) * 0.1);

  // 4. Draw Our Adorable Chubby Climbing Kitten!
  const kPt = cliffPoint(catSmoothPct);
  const kMode = isSummit ? 'summit' : (isClimbing ? 'climbing' : 'idle');
  const kX = isSummit ? 264 : (kPt.x - 2);
  const kY = isSummit ? 52 : (kPt.y - 18);
  const kAng = isSummit ? 0 : (isClimbing ? kPt.angle * 0.55 : -0.14);
  drawKitten(ctx, kX, kY, kAng, kMode, catTime, catPokeBoost);

  // 5. Update & Render Particles (dust puffs, hearts, sparkles)
  for (let i = catParticles.length - 1; i >= 0; i--) {
    const p = catParticles[i];
    p.life += dt;
    if (p.life >= p.maxLife) { catParticles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const alpha = Math.max(0, 1 - p.life / p.maxLife);
    if (p.kind === 'dust') {
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.85})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.7 + p.life), 0, Math.PI * 2);
      ctx.fill();
    } else if (p.kind === 'heart') {
      drawHeart(ctx, p.x, p.y, p.size, alpha);
    } else {
      drawFourPointStar(ctx, p.x, p.y, p.size * 0.75, '#f2bd3a', alpha);
    }
  }

  ctx.restore();
  catAnimRaf = requestAnimationFrame(renderCatScene);
}

function startCatAnim() {
  if (!catAnimRaf) {
    catLastTs = 0;
    catAnimRaf = requestAnimationFrame(renderCatScene);
  }
}

function setCatProgress(ratio) {
  const r = Math.max(0, Math.min(1, ratio));
  catTargetPct = r;
  if (r === 0 && cmState === 'prompt') catSmoothPct = 0;
  document.getElementById('cmTrackFill').style.width = Math.round(r * 100) + '%';
  document.getElementById('cmPct').textContent = Math.round(r * 100) + '%';
}

function openCacheModal(mode = 'prompt') {
  cmState = mode;
  const bd = document.getElementById('cmBackdrop');
  const prog = document.getElementById('cmProgBox');
  const mainBtn = document.getElementById('cmMainBtn');
  const subBtn = document.getElementById('cmSubBtn');
  const title = document.getElementById('cmTitle');
  const sub = document.getElementById('cmSub');

  mainBtn.classList.remove('done');
  if (mode === 'prompt') {
    title.textContent = '先缓存高清图，浏览更流畅';
    sub.textContent = '为了更好的浏览体验，建议先将全部超清成衣与印花原图缓存到本地，翻页和放大 600% 都能秒开。';
    prog.classList.remove('show');
    mainBtn.textContent = '立即缓存图片';
    mainBtn.style.display = 'block';
    subBtn.textContent = '先直接浏览';
    subBtn.style.display = 'block';
    setCatProgress(0);
  } else if (mode === 'running') {
    title.textContent = '正在为您缓存超清图片';
    sub.textContent = '小猫登顶后，翻页和放大细节都能秒开（点小猫可以摸它）。';
    prog.classList.add('show');
    mainBtn.style.display = 'none';
    subBtn.textContent = '先后台下载，我边看边等';
    subBtn.style.display = 'block';
  } else if (mode === 'done') {
    title.textContent = '全部缓存完成';
    sub.textContent = '所有超清成衣、印花细节和 DIY 素材都已在本地就绪。';
    prog.classList.add('show');
    document.getElementById('cmStage').textContent = '登顶成功！';
    mainBtn.textContent = '开始浏览';
    mainBtn.classList.add('done');
    mainBtn.style.display = 'block';
    subBtn.style.display = 'none';
    catTargetPct = 1;
    catSmoothPct = 1;
    setCatProgress(1);
  } else if (mode === 'warn') {
    title.textContent = '有几张图网络卡住了';
    sub.textContent = '已缓存的图片都能秒开，点下面按钮可只补下漏掉的那几张。';
    prog.classList.add('show');
    mainBtn.textContent = '重试未完成的图片';
    mainBtn.style.display = 'block';
    subBtn.textContent = '先直接浏览';
    subBtn.style.display = 'block';
  }
  bd.classList.add('open');
  startCatAnim();
}

function dismissCacheModal() {
  cmDismissed = true;
  document.getElementById('cmBackdrop').classList.remove('open');
}

function onCacheModalAction() {
  if (cmState === 'done') {
    dismissCacheModal();
    return;
  }
  runActualPrecache();
}

function handleCacheBtnClick() {
  const btn = document.getElementById('cacheBtn');
  if (cacheRunning) {
    openCacheModal('running');
    return;
  }
  if (btn.classList.contains('done')) {
    if (!getAllCacheUrls().length) { runActualPrecache(); return; }
    openCacheModal('done');
    return;
  }
  openCacheModal('prompt');
  setTimeout(() => runActualPrecache(), 80);
}

async function runActualPrecache() {
  if (cacheRunning) { openCacheModal('running'); return; }
  const btn = document.getElementById('cacheBtn');
  const fill = document.getElementById('cacheFill');
  const urls = getAllCacheUrls();

  // Offline self-contained HTML: play a smooth 1.4s climbing cat preview so user can enjoy it!
  if (!urls.length) {
    cacheRunning = true;
    openCacheModal('running');
    const totalDemo = 41;
    for (let i = 1; i <= totalDemo; i++) {
      const r = i / totalDemo;
      document.getElementById('cmCountText').textContent = `${i} / ${totalDemo} 张（离线内置）`;
      document.getElementById('cmStage').textContent = r < 0.4 ? '正在校验 10 款超清成衣…' : (r < 0.78 ? '正在校验印花细节原图…' : '正在校验 DIY 拼装素材…');
      setCatProgress(r);
      await new Promise(res => setTimeout(res, 55));
    }
    cacheRunning = false;
    btn.className = 'cache-btn done';
    btn.textContent = '已离线缓存 ✓';
    openCacheModal('done');
    return;
  }

  cacheRunning = true;
  openCacheModal('running');
  btn.className = 'cache-btn busy';
  fill.classList.remove('done');
  fill.classList.add('show');

  let cacheObj = null;
  try {
    if ('caches' in window) cacheObj = await caches.open(CACHE_NAME);
  } catch (_) {}

  let done = 0;
  let failed = 0;
  const total = urls.length;
  const queue = [...urls];
  const updateProgress = () => {
    const r = done / total;
    const pct = Math.round(r * 100);
    fill.style.width = pct + '%';
    btn.textContent = `缓存中 ${done}/${total}`;
    document.getElementById('cmCountText').textContent = `${done} / ${total} 张`;
    document.getElementById('cmStage').textContent =
      done < 14 ? '正在缓存 10 款超清成衣…' :
      done < 26 ? '正在缓存 2400px 印花细节…' :
      done < total ? '正在缓存 DIY 拼装素材…' : '登顶成功！';
    setCatProgress(r);
  };
  updateProgress();

  const workers = Array.from({ length: 4 }, async () => {
    while (queue.length) {
      const u = queue.shift();
      const ok = await fetchOneWithCache(u, cacheObj, 2);
      done++;
      if (!ok) failed++;
      updateProgress();
    }
  });
  await Promise.all(workers);

  cacheRunning = false;
  applyCachedDom();
  if (appMode === 'vote') { renderStage(); renderStarred(); }
  else { renderDiyAll(); }

  if (failed === 0) {
    btn.className = 'cache-btn done';
    btn.textContent = '已缓存 ✓';
    fill.classList.add('done');
    fill.style.width = '100%';
    setTimeout(() => { fill.classList.remove('show'); }, 1200);
    if (document.getElementById('cmBackdrop').classList.contains('open')) {
      openCacheModal('done');
      setTimeout(() => {
        if (cmState === 'done') dismissCacheModal();
      }, 2400);
    }
  } else {
    btn.className = 'cache-btn warn';
    btn.textContent = `重试(${failed})`;
    setTimeout(() => { fill.classList.remove('show'); }, 1200);
    if (document.getElementById('cmBackdrop').classList.contains('open')) {
      openCacheModal('warn');
    }
  }
}

async function autoRestoreCache() {
  const urls = getAllCacheUrls();
  const btn = document.getElementById('cacheBtn');
  if (!urls.length) {
    btn.className = 'cache-btn done';
    btn.textContent = '已离线缓存 ✓';
    return;
  }
  if (!('caches' in window)) return;
  try {
    const keys = await caches.keys();
    await Promise.all(keys.filter(k => k.startsWith('ether-vote-cache-') && k !== CACHE_NAME).map(k => caches.delete(k)));
    const cacheObj = await caches.open(CACHE_NAME);
    let hits = 0;
    await Promise.all(urls.map(async u => {
      const m = await cacheObj.match(u);
      if (m) {
        const blob = await m.blob();
        blobCache.set(u, URL.createObjectURL(blob));
        hits++;
      }
    }));
    if (hits > 0) {
      applyCachedDom();
      renderStage();
      renderStarred();
    }
    if (hits === urls.length) {
      btn.className = 'cache-btn done';
      btn.textContent = '已缓存 ✓';
      return;
    }
  } catch (_) {}
  // Online & not fully cached yet -> gently invite user to precache for smooth browsing!
  if (!cmDismissed && !sessionStorage.getItem('ether_cm_prompted_v6')) {
    sessionStorage.setItem('ether_cm_prompted_v6', '1');
    setTimeout(() => {
      if (!cacheRunning && !cmDismissed) openCacheModal('prompt');
    }, 360);
  }
}

initDiyDefault();
renderStage();
renderStarred();
autoRestoreCache();
</script>
